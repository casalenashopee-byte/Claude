services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/prod.db"
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env antes de subir}
      # Opcional — veja .env.example para envio de e-mail de redefinição de senha.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      # Persiste o banco SQLite entre reinícios/atualizações do container.
      - vendafacil-data:/app/data
    restart: unless-stopped

volumes:
  vendafacil-data:
